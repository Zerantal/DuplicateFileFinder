name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: Build + Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Makes test failures easier to diagnose in CI logs.
      VSTEST_CONNECTION_TIMEOUT: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.fsproj
            **/*.props
            **/*.targets
            **/packages.lock.json
            global.json

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      # Optional: ensure deterministic build warnings are visible
      - name: Test (Release)
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test_results.trx" --results-directory "./artifacts/test-results" --collect "XPlat Code Coverage"
        shell: bash

      - name: Upload test results (TRX + coverage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: ignore

  # Lightweight hygiene job: keeps your repo from drifting.
  formatting:
    name: Format check (dotnet format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/packages.lock.json
            global.json

      - name: Restore
        run: dotnet restore

      # Requires a repo-level .editorconfig to be meaningful. If you don't have it, add one later.
      - name: Verify formatting
        run: dotnet format --verify-no-changes

