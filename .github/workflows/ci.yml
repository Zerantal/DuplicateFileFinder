name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: Build + Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CONFIGURATION: Release
      DOTNET_EnablePackageManagerResourceMonitoring: 0
      UseSharedCompilation: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/packages.lock.json
            global.json

      - name: SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore DuplicateFileFinder.ci.slnf /p:RestoreLockedMode=true

      - name: Build solution (Release) (no parallel)        
        run: dotnet build DuplicateFileFinder.ci.slnf -c ${{ env.CONFIGURATION }} --no-restore /p:UseSharedCompilation=false /m:1          
      
      - name: Test (DuplicateFileFinderLibTests)
        run: >
          dotnet test DuplicateFileFinderLibTests/DuplicateFileFinderLibTests.csproj
          -c ${{ env.CONFIGURATION }}
          -f net10.0
          --no-build
          --logger "trx;LogFileName=test_results.trx"
          --results-directory "./artifacts/test-results"
          --collect "XPlat Code Coverage"
          -- RunConfiguration.FailIfNoTests=true
          
      - name: Upload coverage to Codecov (Linux)
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          files: artifacts/test-results/**/coverage.cobertura.xml
          fail_ci_if_error: true

      - name: Upload test results + coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: warn
