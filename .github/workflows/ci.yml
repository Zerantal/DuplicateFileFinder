name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: Build + Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CONFIGURATION: Release
      DOTNET_EnablePackageManagerResourceMonitoring: 0
      UseSharedCompilation: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/packages.lock.json
            global.json

      - name: Restore solution
        run: dotnet restore DuplicateFileFinder.sln

      - name: Build solution (Release)
        run: dotnet build DuplicateFileFinder.sln -c ${{ env.CONFIGURATION }} --no-restore /p:UseSharedCompilation=false
      
      - name: Test (DuplicateFileFinderLibTests)
        run: >
          dotnet test DuplicateFileFinderLibTests/DuplicateFileFinderLibTests.csproj
          -c ${{ env.CONFIGURATION }}
          -f net8.0
          --no-build
          --logger "trx;LogFileName=test_results.trx"
          --results-directory "./artifacts/test-results"
          --RunConfiguration.FailIfNoTests=true



      - name: Upload test results + coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: warn
